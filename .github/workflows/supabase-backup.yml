# Daily backup of the cloud Supabase database. The free tier has no automatic
# backups, so we take our own: a custom-format pg_dump of the public schema
# plus one CSV per table (readable by eye), uploaded as a workflow artifact.
#
# REQUIREMENT: THE REPOSITORY MUST BE PRIVATE. The dump contains personal
# data (waitlist e-mail addresses and push subscriptions) and artifacts are
# readable by anyone who can read a public repository. If the repository ever
# becomes public, disable this workflow first.
#
# Limitation: artifacts live at most 90 days and are not real external
# storage. Fine at pre-launch scale; not a substitute for proper backups once
# the data grows or becomes more valuable.
#
# Schedule notes: 09:17 UTC is a different hour from health-ping so the two
# jobs do not land in the same runner pool; GitHub may delay runs by 15+
# minutes and disables schedules after 60 days of repository inactivity.
#
# Needs: secret SUPABASE_DB_URL (connection string of the cloud database).
name: Supabase backup

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # !!! VERIFY BEFORE THE FIRST RUN !!!
  # Must equal the major Postgres version of the CLOUD project (Supabase
  # dashboard -> Settings -> Infrastructure). pg_dump refuses to dump a
  # server newer than itself. 17 is only a starting point, not a verified
  # value for this project.
  PG_MAJOR: "17"

jobs:
  backup:
    name: Dump database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The runner ships an older client, and the /usr/bin/pg_dump wrapper
      # picks the OLDEST installed major by default. So we install the right
      # major from the PGDG repository and put its bin directory first on PATH
      # via $GITHUB_PATH; later steps then resolve pg_dump/psql from it.
      - name: Install matching PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y "postgresql-client-${PG_MAJOR}"
          echo "/usr/lib/postgresql/${PG_MAJOR}/bin" >> "$GITHUB_PATH"

      - name: Compute timestamp
        id: ts
        run: echo "value=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"

      - name: Dump the public schema (custom format)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          STAMP: ${{ steps.ts.outputs.value }}
        run: |
          set -euo pipefail
          : "${SUPABASE_DB_URL:?Secret SUPABASE_DB_URL is not set}"
          pg_dump --version
          mkdir -p backup
          pg_dump --no-owner --no-privileges --schema=public \
            --format=custom --file="backup/ministry-${STAMP}.dump" \
            "${SUPABASE_DB_URL}"

      # An empty dump that silently ends up in the artifacts is worse than no
      # backup at all, so refuse anything suspiciously small.
      - name: Sanity-check the dump size
        env:
          STAMP: ${{ steps.ts.outputs.value }}
        run: |
          set -euo pipefail
          size=$(wc -c < "backup/ministry-${STAMP}.dump")
          echo "Dump size: ${size} bytes"
          if [ "${size}" -lt 512 ]; then
            echo "::error::Dump is smaller than 512 bytes, refusing to keep it"
            exit 1
          fi

      # Tables are discovered through pg_tables, so a new table is backed up
      # without editing this workflow. Even an empty table yields a header
      # row, hence an empty file means the connection was cut mid-way.
      - name: Export every public table to CSV
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          : "${SUPABASE_DB_URL:?Secret SUPABASE_DB_URL is not set}"
          mkdir -p backup/csv
          tables=$(psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 -At \
            -c "select tablename from pg_tables where schemaname = 'public' order by 1")
          if [ -z "${tables}" ]; then
            echo "::error::No tables found in schema public"
            exit 1
          fi
          for t in ${tables}; do
            psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 \
              -c "\copy (select * from public.\"${t}\") to 'backup/csv/${t}.csv' with csv header"
            if [ ! -s "backup/csv/${t}.csv" ]; then
              echo "::error::CSV for ${t} is empty (header missing)"
              exit 1
            fi
          done
          ls -l backup/csv

      - name: Upload the backup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supabase-backup-${{ steps.ts.outputs.value }}
          path: backup/
          retention-days: 90
          if-no-files-found: error
