<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1e4a40" />
    <meta name="robots" content="noindex" />
    <title>Offline — MinistryApp</title>
    <style>
      /*
       * Intentionally standalone: no external CSS, JS, fonts or images.
       * Keep these values aligned with src/app/styles/globals.css.
       */
      :root {
        color-scheme: light;
        font-family: -apple-system, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #f6f5f3;
        color: #22302c;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100dvh;
        background: #f6f5f3;
      }

      main {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        padding: max(40px, env(safe-area-inset-top)) max(32px, env(safe-area-inset-right))
          max(40px, env(safe-area-inset-bottom)) max(32px, env(safe-area-inset-left));
        text-align: center;
      }

      .glyph {
        width: 56px;
        height: 56px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: #1e4a40;
        color: #fff;
      }

      .copy {
        display: flex;
        max-width: 360px;
        flex-direction: column;
        gap: 8px;
        align-items: center;
      }

      h1 {
        margin: 0;
        font-size: 32px;
        line-height: 1.1;
        font-weight: 640;
        letter-spacing: -0.03em;
      }

      p {
        margin: 0;
        color: rgba(34, 48, 44, 0.72);
        font-size: 15px;
        line-height: 1.45;
        font-weight: 500;
        text-wrap: pretty;
      }

      button {
        width: min(100%, 260px);
        height: 50px;
        border: 0;
        border-radius: 17px;
        background: #1e4a40;
        color: #fff;
        font: inherit;
        font-size: 16px;
        font-weight: 580;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      button:active:not(:disabled) {
        transform: translateY(1px) scale(0.98);
      }

      button:focus-visible {
        outline: 3px solid rgba(46, 111, 94, 0.35);
        outline-offset: 3px;
      }

      button:disabled {
        cursor: default;
        opacity: 0.5;
      }

      .button-content {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .spinner {
        display: none;
        width: 16px;
        height: 16px;
        animation: spin 0.8s linear infinite;
      }

      button[data-busy="true"] .spinner {
        display: block;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
        }

        button:active:not(:disabled) {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="glyph" aria-hidden="true">
        <svg
          width="28"
          height="28"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M2.75 8.7A15.1 15.1 0 0 1 6.2 6.55"></path>
          <path d="M10.1 5.08A15.4 15.4 0 0 1 21.25 8.7"></path>
          <path d="M5.6 12.05a10.2 10.2 0 0 1 3.15-1.75"></path>
          <path d="M12.4 9.82a10.25 10.25 0 0 1 6 2.23"></path>
          <path d="M8.7 15.35a5.15 5.15 0 0 1 6.6 0"></path>
          <circle cx="12" cy="18.6" r="0.9" fill="currentColor" stroke="none"></circle>
          <path d="M3.5 3.5 20.5 20.5"></path>
        </svg>
      </div>

      <div class="copy">
        <h1>You’re offline</h1>
        <p>Check your Wi-Fi or mobile data, then try again.</p>
      </div>

      <button id="retry" type="button">
        <span class="button-content">
          <svg class="spinner" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity="0.15" stroke-width="3"></circle>
            <path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round"></path>
          </svg>
          <span id="retry-label">Try again</span>
        </span>
      </button>
    </main>

    <script>
      (() => {
        // Must stay in step with WEB_API_ROUTES.health (src/shared/config/
        // api-routes.ts) and HEALTH_PATH (src/app/sw.ts). This file is plain
        // static HTML outside the bundler, so nothing can import the constant
        // and nothing catches a typo — it was wrong here ("/api/health") while
        // both of the others were right.
        const HEALTH_URL = "/api/v1/health";
        const TIMEOUT_MS = 5000;
        const RETRY_INTERVAL_MS = 10000;
        const button = document.getElementById("retry");
        const label = document.getElementById("retry-label");
        let checking = false;

        const setBusy = (busy) => {
          checking = busy;
          button.disabled = busy;
          button.dataset.busy = String(busy);
          label.textContent = busy ? "Checking…" : "Try again";
        };

        const checkAndReload = async () => {
          if (checking || navigator.onLine === false) return;

          setBusy(true);
          const controller = new AbortController();
          const timeout = window.setTimeout(() => controller.abort(), TIMEOUT_MS);

          try {
            const response = await fetch(HEALTH_URL, {
              method: "GET",
              cache: "no-store",
              credentials: "omit",
              signal: controller.signal,
            });

            // A resolved fetch proves nothing: a 404, a 502 from a broken
            // origin, or a captive portal's 200 login page all resolve.
            // Reloading on any of them turns a broken origin into a reload
            // every RETRY_INTERVAL_MS. Only a 2xx from the health endpoint
            // (it answers 204) means the origin is really serving.
            if (!response.ok) {
              setBusy(false);
              return;
            }

            window.location.reload();
          } catch {
            setBusy(false);
          } finally {
            window.clearTimeout(timeout);
          }
        };

        button.addEventListener("click", () => void checkAndReload());
        window.addEventListener("online", () => void checkAndReload());
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") {
            void checkAndReload();
          }
        });

        window.setInterval(() => {
          if (document.visibilityState === "visible") {
            void checkAndReload();
          }
        }, RETRY_INTERVAL_MS);
      })();
    </script>
  </body>
</html>
